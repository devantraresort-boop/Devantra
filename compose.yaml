x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://resort:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/devantara
  init: true

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: devantara
      POSTGRES_USER: resort
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resort -d devantara"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  migrate:
    <<: *app
    command: ["python", "-m", "backend.app.migrate"]
    depends_on:
      db:
        condition: service_healthy
  api:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
  worker:
    <<: *app
    command: ["python", "-m", "backend.app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
