[project]
name = "devantara-resort"
version = "1.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "pydantic-settings>=2.7,<3",
    "email-validator>=2.2,<3",
    "PyJWT>=2.10,<3",
    "pwdlib[argon2]>=0.2,<1",
    "slowapi>=0.1.9,<1",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
    "redis>=5,<7",
]

[tool.vercel]
entrypoint = "backend.app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:datetime.datetime.utcnow.*:DeprecationWarning"]
